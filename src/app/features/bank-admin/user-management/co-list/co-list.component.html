<div class="list-wrapper">
    <div class="search-section">
        <div class="search-bar">
            <span class="material-symbols-outlined">search</span>
            <input 
                type="text" 
                [(ngModel)]="searchQuery" 
                (ngModelChange)="onSearchChange()" 
                placeholder="Search by email address..."
            />
        </div>
        <button class="btn-refresh" (click)="fetchOfficers()" [disabled]="isLoading">
            <span class="material-symbols-outlined" [class.spinning]="isLoading">refresh</span>
        </button>
    </div>

    <div class="table-container">
        <div class="loading-overlay" *ngIf="isLoading">
            <div class="spinner-large"></div>
            <p>Loading officers...</p>
        </div>

        <table *ngIf="!isLoading && filteredOfficers.length > 0">
            <thead>
                <tr>
                    <th>Compliance Officer</th>
                    <th>Status</th>
                    <th>Security</th>
                    <th class="actions-col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let co of filteredOfficers">
                    <td>
                        <div class="user-info">
                            <div class="avatar">
                                {{ co.email[0].toUpperCase() }}
                            </div>
                            <span class="email">{{ co.email }}</span>
                        </div>
                    </td>
                    <td>
                        <span class="badge" [class.suspended]="co.isSuspended">
                            {{ co.isSuspended ? 'Suspended' : 'Active' }}
                        </span>
                    </td>
                    <td>
                        <span class="badge" [class.locked]="co.isLocked">
                            {{ co.isLocked ? 'Locked' : 'Unlocked' }}
                        </span>
                    </td>
                    <td class="actions-col">
                        <button class="icon-btn" title="Manage Settings">
                            <span class="material-symbols-outlined">settings</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="!isLoading && filteredOfficers.length === 0" class="empty-state">
            <span class="material-symbols-outlined">person_off</span>
            <p>No compliance officers found matching your search.</p>
        </div>
    </div>
</div>

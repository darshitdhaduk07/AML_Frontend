<div class="card">
  <h2>{{ isSystemAdmin ? 'System Admin Login' : 'Sign in' }}</h2>
  <div class="sub">Access the AML Compliance control center.</div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <app-role-toggle 
      *ngIf="!isSystemAdmin"
      [selectedRole]="loginForm.get('role')?.value" 
      (roleChange)="onRoleChange($event)">
    </app-role-toggle>

    <div class="group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="name@company.com" />
    </div>

    <div class="group">
      <div class="row">
        <label>Password</label>
        <a href="#" class="link">Forgot?</a>
      </div>
      <input type="password" formControlName="password" placeholder="Enter password" />
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Secure Login</button>
  </form>

  <app-auth-footer></app-auth-footer>
</div>

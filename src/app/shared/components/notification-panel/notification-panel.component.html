<div class="notification-overlay" *ngIf="isOpen" (click)="onClose()"></div>
<div class="notification-panel" [class.open]="isOpen">
    <div class="panel-header">
        <h3>Notifications</h3>
        <button class="close-btn" (click)="onClose()">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <div class="panel-content">
        <div *ngIf="loading" class="loading-state">
            <div class="spinner"></div>
            <p>Loading notifications...</p>
        </div>

        <div *ngIf="!loading && notifications.length === 0" class="empty-state">
            <span class="material-symbols-outlined">notifications_off</span>
            <p>No notifications yet</p>
        </div>

        <div *ngIf="!loading && notifications.length > 0" class="notification-list">
            <div 
                *ngFor="let notification of notifications" 
                class="notification-item" 
                [class.unread]="!notification.isRead"
                (click)="markAsRead(notification.id)"
            >
                <div class="notification-icon" [ngClass]="getTypeClass(notification.type)">
                    <span class="material-symbols-outlined">{{ getIcon(notification.type) }}</span>
                </div>
                <div class="notification-info">
                    <p class="message">{{ notification.message }}</p>
                    <p class="time">{{ notification.createdAt | date:'short' }}</p>
                </div>
                <div *ngIf="!notification.isRead" class="unread-dot"></div>
            </div>
        </div>
    </div>

    <div class="panel-footer" *ngIf="notifications.length > 0">
        <button class="view-all">View all activity</button>
    </div>
</div>

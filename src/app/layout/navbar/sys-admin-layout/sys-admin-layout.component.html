<div class="admin-wrapper">
  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="logo-icon">🛡️</span>
        <div class="logo-text">
          <span class="main">AML PLATFORM</span>
          <span class="sub">System Governance</span>
        </div>
      </div>

      <nav class="nav-links">
        <a routerLink="/sys/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/sys/rule-engine" routerLinkActive="active">Rule Engine</a>
        <a routerLink="/sys/bank-registry" routerLinkActive="active">Bank Onboarding</a>
        <a routerLink="/sys/reports" routerLinkActive="active">Global Reports</a>
      </nav>

      <div class="user-actions">
        <div class="user-info">
          <span class="role">Admin Session</span>
          <span class="status-dot"></span>
        </div>
        <button class="logout-btn" (click)="logout()">
          <span>Logout</span>
          <i class="icon-exit"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-content">
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

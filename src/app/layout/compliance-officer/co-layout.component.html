<div class="co-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">🔍</span>
      <div class="logo-text">
        <span class="main">INVESTIGATE</span>
        <span class="sub">Officer Portal</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/co/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="material-symbols-outlined">work</span>
        My Cases
      </a>
      <a routerLink="/co/alerts" routerLinkActive="active">
        <span class="material-symbols-outlined">warning</span>
        Alert Review
      </a>
      <a routerLink="/co/history" routerLinkActive="active">
        <span class="material-symbols-outlined">history</span>
        Historical Data
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <span class="material-symbols-outlined">logout</span>
        Logout
      </button>
    </div>
  </aside>

  <main class="content-area">
    <header class="top-bar">
      <div class="user-profile">
        <span class="user-name">Investigator</span>
        <span class="user-role">Compliance Officer</span>
      </div>
    </header>
    <div class="page-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

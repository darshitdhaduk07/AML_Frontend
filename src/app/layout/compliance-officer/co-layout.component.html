<div class="layout-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <span
                    class="material-symbols-outlined"
                    style="color: white; font-size: 20px"
                    >search</span
                >
            </div>
            <div class="sidebar-title">
                <h2>Investigation</h2>
                <p>Compliance Officer</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a
                routerLink="/co/alerts"
                routerLinkActive="active"
                class="nav-link"
            >
                <span class="material-symbols-outlined">warning</span>
                Assigned Alerts
            </a>

            <a
                routerLink="/co/cases"
                routerLinkActive="active"
                class="nav-link"
            >
                <span class="material-symbols-outlined">folder_shared</span>
                Investigation Cases
            </a>
        </nav>

        <div class="sidebar-footer">

            <button (click)="logout()" class="footer-btn logout">
                <span class="material-symbols-outlined">logout</span>
                Logout
            </button>
        </div>
    </aside>

    <header class="main-header">
        <div class="header-breadcrumb">
            <span class="root">Compliance</span>
            <span class="separator">/</span>
            <span class="current">{{ getPageTitle() }}</span>
        </div>
        <div class="header-spacer" style="flex: 1"></div>

        <div class="header-actions">
            <button class="icon-btn" (click)="toggleNotifications()">
                <span class="material-symbols-outlined">notifications</span>
                <span class="badge" *ngIf="(unreadCount$ | async) as count">{{ count }}</span>
            </button>
            <app-notification-panel 
                [isOpen]="isNotificationOpen" 
                (close)="isNotificationOpen = false">
            </app-notification-panel>
            <div class="header-divider"></div>
            <div class="user-profile">
                <div class="user-details">
                    <p class="name">Compliance Officer</p>
                    <p class="role">Investigator</p>
                </div>
                <div class="user-avatar">CO</div>
            </div>
        </div>
    </header>
    <main class="main-content">
        <router-outlet></router-outlet>
    </main>
</div>

<div class="layout-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="material-symbols-outlined" style="color: white; font-size: 20px;">shield</span>
      </div>
      <div class="sidebar-title">
        <h2>AML Platform</h2>
        <p>System Governance</p>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/sys/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        <span class="material-symbols-outlined">dashboard</span>
        Dashboard
      </a>
      
      <a routerLink="/sys/rule-engine" routerLinkActive="active" class="nav-link">
        <span class="material-symbols-outlined">settings_input_component</span>
        Rule Engine
      </a>
      
      <a routerLink="/sys/bank-registry" routerLinkActive="active" class="nav-link">
        <span class="material-symbols-outlined">account_balance</span>
        Bank Onboarding
      </a>
      
      <a routerLink="/sys/reports" routerLinkActive="active" class="nav-link">
        <span class="material-symbols-outlined">public</span>
        Global Reports
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <button class="footer-btn">
        <span class="material-symbols-outlined">settings</span>
        Settings
      </button>
      <button (click)="logout()" class="footer-btn logout">
        <span class="material-symbols-outlined">logout</span>
        Logout
      </button>
    </div>
  </aside>

  <header class="main-header">
    <div class="header-search">
      <span class="material-symbols-outlined">search</span>
      <input placeholder="Search resources..." type="text"/>
    </div>
    
    <div class="header-actions">
      <button class="icon-btn">
        <span class="material-symbols-outlined">notifications</span>
      </button>
      <div class="header-divider"></div>
      <div class="user-profile">
        <div class="user-details">
          <p class="name">System Admin</p>
          <p class="role">Administrator</p>
        </div>
        <div class="user-avatar">SA</div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

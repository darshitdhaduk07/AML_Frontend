<div class="bank-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">🏦</span>
      <div class="logo-text">
        <span class="main">BANK PORTAL</span>
        <span class="sub">Institutional Console</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/bank/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="material-symbols-outlined">dashboard</span>
        Alert Dashboard
      </a>
      <a routerLink="/bank/ingestion/upload" routerLinkActive="active">
        <span class="material-symbols-outlined">upload_file</span>
        Batch Upload
      </a>
      <!-- Links for routes that will be added later -->
      <a routerLink="/bank/users" routerLinkActive="active">
        <span class="material-symbols-outlined">group</span>
        User Management
      </a>
      <a routerLink="/bank/cases" routerLinkActive="active">
        <span class="material-symbols-outlined">work</span>
        Case Tracking
      </a>
      <a routerLink="/bank/reports" routerLinkActive="active">
        <span class="material-symbols-outlined">description</span>
        Reports
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <span class="material-symbols-outlined">logout</span>
        Logout
      </button>
    </div>
  </aside>

  <main class="content-area">
    <header class="top-bar">
      <div class="user-profile">
        <span class="user-name">Bank Admin</span>
        <span class="user-role">Compliance Officer</span>
      </div>
    </header>
    <div class="page-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
